name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Validate spec
        run: python validate.py

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest

  artifacts:
    # The catalog is a build artifact, not source. This job proves the committed
    # spec still generates cleanly and that nobody hand-edited a generated file
    # instead of editing feature_space.yaml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Generated files must not be committed
        run: |
          for f in candidates.csv feature_catalog.xlsx; do
            if git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
              echo "::error file=$f::$f is a build artifact and must not be committed."
              echo "Regenerate it with 'make workbook'. Edit feature_space.yaml, never the artifact."
              exit 1
            fi
          done

      - name: Build every resolution rung
        run: |
          for lvl in L0 L1 L2; do
            python expand_catalog.py --level "$lvl" --out "/tmp/$lvl.csv"
          done

      - name: Build workbook
        # build_workbook.py reads ./candidates.csv, which the rung loop above
        # deliberately does not write. Generate the shipping rung at the
        # default path first.
        run: |
          python expand_catalog.py --level L0
          python build_workbook.py

      - name: Build context pack
        run: |
          python pack.py --level L0

      - name: Upload catalog for review
        uses: actions/upload-artifact@v4
        with:
          name: feature-catalog
          path: |
            /tmp/L0.csv
            feature_catalog.xlsx
            pack/
          if-no-files-found: warn
          retention-days: 14
